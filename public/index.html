<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Acadza · Report → Fix console</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --ink: #14171c;
        --mut: #5d6673;
        --line: #e3e6ea;
        --acc: #2f5bea;
        --bad: #c62828;
        --good: #1b7f3b;
        --warn: #b26a00;
        --delbg: #fde4e4;
        --insbg: #ddf5e3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101318;
          --panel: #181c23;
          --ink: #e8ebf0;
          --mut: #9aa4b2;
          --line: #2a303a;
          --acc: #7c9bff;
          --bad: #ff8a80;
          --good: #6fdc8c;
          --warn: #ffb74d;
          --delbg: #4a2326;
          --insbg: #1d3d29;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font:
          15px/1.5 system-ui,
          Segoe UI,
          sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 16px;
        margin: 0;
        flex: 1;
      }
      button {
        font: inherit;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      button.p {
        background: var(--acc);
        color: #fff;
        border-color: var(--acc);
      }
      button.b {
        color: var(--bad);
      }
      button.on {
        border-color: var(--acc);
        color: var(--acc);
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #list {
        width: 340px;
        border-right: 1px solid var(--line);
        overflow: auto;
        background: var(--panel);
      }
      #detail {
        flex: 1;
        overflow: auto;
        padding: 16px 20px 90px;
      }
      .row {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .row.sel {
        background: color-mix(in srgb, var(--acc) 12%, transparent);
      }
      .row small {
        color: var(--mut);
      }
      .chip {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 99px;
        font-size: 12px;
        border: 1px solid var(--line);
        margin-right: 4px;
      }
      .chip.hi {
        color: var(--bad);
        border-color: var(--bad);
      }
      .chip.ok {
        color: var(--good);
        border-color: var(--good);
      }
      .chip.w {
        color: var(--warn);
        border-color: var(--warn);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        margin: 12px 0;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mut);
      }
      .q {
        font-size: 16px;
      }
      .q math {
        font-size: 1.1em;
      }
      .diff {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 13px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      del {
        background: var(--delbg);
        text-decoration: line-through;
      }
      ins {
        background: var(--insbg);
        text-decoration: none;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .bubble {
        background: color-mix(in srgb, var(--acc) 10%, transparent);
        border-radius: 14px 14px 14px 4px;
        padding: 10px 14px;
        margin: 6px 0;
      }
      textarea,
      input {
        width: 100%;
        font: inherit;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px;
      }
      .bar {
        position: sticky;
        bottom: 0;
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding: 10px 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .cmt {
        color: var(--mut);
      }
      @media (max-width: 800px) {
        main {
          flex-direction: column;
        }
        #list {
          width: 100%;
          max-height: 35vh;
        }
        .two {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Report → Fix · faculty console</h1>
      <span id="tabs"></span>
      <button id="logb">Audit log</button>
    </header>
    <main>
      <div id="list"></div>
      <div id="detail"></div>
    </main>
    <script src="data.js" charset="utf-8"></script>
    <script>
      const D = window.DATA,
        $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const body = (q) => q[q.questionType];
      // Urgency: a wrong answer key silently costs marks for every student, so it ranks first.
      const W = {
        answer_key: 100,
        type_mismatch: 80,
        stem_data: 70,
        unsound: 70,
        option_repair: 60,
        solution_fix: 60,
        wrong_question: 60,
        diagram: 50,
        identical_options: 50,
      };
      const rep = Object.fromEntries(D.reports.map((r) => [r.reportId, r]));
      const qs = Object.fromEntries(D.questions.map((q) => [q._id, q]));
      const g = {};
      D.results.forEach((r) => (g[r.questionId] ??= []).push(r));
      const items = Object.entries(g)
        .map(([qid, rs]) => {
          const d = rs.filter((r) => r.verdict === "defect"),
            primary = d.find((r) => r.edit) || d[0] || rs[0];
          const act = d.length > 0,
            score = act ? (W[primary.repair] || 20) + 8 * (rs.length - 1) : 0;
          const latest = Math.max(
            ...rs.map((r) => +new Date(rep[r.reportId].reportedAt)),
          );
          return { qid, q: qs[qid], rs, primary, act, score, latest };
        })
        .sort((a, b) => b.score - a.score || b.latest - a.latest);
      let audit = [];
      try {
        audit = JSON.parse(localStorage.getItem("acadza_audit") || "[]");
      } catch {}
      const persist = () => {
        try {
          localStorage.setItem("acadza_audit", JSON.stringify(audit));
        } catch {}
      };
      const last = (id) => [...audit].reverse().find((a) => a.qid === id);
      let tab = "todo",
        sel = null,
        editing = false,
        showLog = false;
      const vis = () =>
        items.filter((i) =>
          tab === "todo"
            ? i.act && !last(i.qid)
            : tab === "done"
              ? !!last(i.qid)
              : !i.act && !last(i.qid),
        );
      function applyEdit(res, q) {
        const e = res.edit;
        if (!e) return null;
        if (e.field === "answer")
          return { field: "answer", before: e.find, after: e.replace };
        const h = body(q)[e.field] || "";
        return {
          field: e.field,
          before: h,
          after: h.replace(e.find, () => e.replace),
          find: e.find,
          replace: e.replace,
        };
      }
      function diffHtml(ap) {
        if (ap.field === "answer")
          return `<span class="diff">answer: <del>${esc(ap.before)}</del> → <ins>${esc(ap.after)}</ins></span>`;
        const i = ap.before.indexOf(ap.find),
          a = ap.before.slice(Math.max(0, i - 70), i),
          z = ap.before.slice(i + ap.find.length, i + ap.find.length + 70);
        return `<span class="diff">${ap.field}: …${esc(a)}<del>${esc(ap.find) || "∅"}</del><ins>${esc(ap.replace) || "∅"}</ins>${esc(z)}…</span>`;
      }
      function tabs() {
        const n = {
          todo: items.filter((i) => i.act && !last(i.qid)).length,
          done: items.filter((i) => last(i.qid)).length,
          nochange: items.filter((i) => !i.act && !last(i.qid)).length,
        };
        $("#tabs").innerHTML = [
          ["todo", "To review"],
          ["done", "Decided"],
          ["nochange", "No change"],
        ]
          .map(
            ([k, l]) =>
              `<button class="${tab === k ? "on" : ""}" data-t="${k}">${l} (${n[k]})</button>`,
          )
          .join(" ");
        $("#tabs")
          .querySelectorAll("button")
          .forEach(
            (b) =>
              (b.onclick = () => {
                tab = b.dataset.t;
                sel = null;
                showLog = false;
                render();
              }),
          );
      }
      function render() {
        tabs();
        const v = vis();
        if (!sel || !v.find((i) => i.qid === sel)) sel = v[0]?.qid || null;
        $("#list").innerHTML =
          v
            .map((i) => {
              const p = i.primary,
                b = body(i.q);
              return `<div class="row ${i.qid === sel ? "sel" : ""}" data-q="${i.qid}"><b>${esc(i.q.chapter)}</b><br>
    <span class="chip ${p.repair === "answer_key" ? "hi" : i.act ? "w" : ""}">${esc(p.repair || p.verdict)}</span><span class="chip">${i.rs.length} report${i.rs.length > 1 ? "s" : ""}</span><span class="chip">${esc(p.route)}</span><br><small>${esc(i.q.subject)} · ${esc(i.qid.slice(-6))} · conf ${p.confidence}</small></div>`;
            })
            .join("") ||
          `<div class="row"><small>Nothing here. 🎉</small></div>`;
        $("#list")
          .querySelectorAll(".row[data-q]")
          .forEach(
            (r) =>
              (r.onclick = () => {
                sel = r.dataset.q;
                editing = false;
                showLog = false;
                render();
              }),
          );
        showLog ? renderLog() : renderDetail();
      }
      function renderDetail() {
        const it = items.find((i) => i.qid === sel),
          el = $("#detail");
        if (!it) {
          el.innerHTML = "<p class='cmt'>Select a question.</p>";
          return;
        }
        const { q, rs, primary: p } = it,
          b = body(q),
          ap = applyEdit(p, q),
          L = last(it.qid);
        const ans = Array.isArray(b.answer)
          ? JSON.stringify(b.answer)
          : b.answer;
        el.innerHTML = `
  <div><span class="chip">${esc(q.subject)}</span><span class="chip">${esc(q.chapter)}</span><span class="chip">${esc(q.questionType)}</span><span class="chip">key: ${esc(ans)}</span></div>
  ${L ? `<div class="card"><b>Decision: ${esc(L.action)}</b> <span class="cmt">· ${new Date(L.ts).toLocaleString()}</span></div>` : ""}
  <div class="card"><h3>AI verdict</h3>
    <span class="chip ${p.verdict === "defect" ? "hi" : "ok"}">${esc(p.verdict)}</span><span class="chip">${esc(p.repair || "—")}</span><span class="chip w">${esc(p.route)}</span><span class="chip">confidence ${p.confidence}</span>
    <p>${esc(p.evidence)}</p></div>
  ${
    ap
      ? `<div class="card"><h3>Proposed edit</h3>${diffHtml(ap)}
    ${ap.field !== "answer" ? `<div class="two" style="margin-top:10px"><div><small class="cmt">BEFORE</small><div class="q">${ap.before}</div></div><div><small class="cmt">AFTER</small><div class="q">${ap.after}</div></div></div>` : ""}
    ${editing ? `<p><small class="cmt">Edit replacement text</small><input id="newrep" value="${esc(p.edit.replace)}"></p>` : ""}</div>`
      : ""
  }
  <div class="card"><h3>Reports (${rs.length})</h3>${rs
    .map((r) => {
      const x = rep[r.reportId];
      return `<div><b>${r.reportId}</b> <span class="cmt">${esc(x.source)} · ${new Date(x.reportedAt).toLocaleString()} ·</span> <span class="chip ${r.verdict === "defect" ? "w" : ""}">${esc(r.verdict)}</span><br><span class="cmt">“${esc(x.comment)}”</span></div>`;
    })
    .join("<hr style='border:0;border-top:1px solid var(--line)'>")}</div>
  <div class="card"><h3>Question</h3><div class="q">${b.question}</div></div>
  <details class="card"><summary><b>Stored solution</b></summary><div class="q" style="margin-top:8px">${b.solution || "<i>none</i>"}</div></details>
  <div class="card"><h3>What the student sees</h3>${rs.map((r) => (editing ? `<small class="cmt">${r.reportId}</small><textarea data-r="${r.reportId}" rows="3">${esc(r.student_reply)}</textarea>` : `<div class="bubble"><small class="cmt">${r.reportId}</small><br>${esc(r.student_reply)}</div>`)).join("")}</div>
  <div class="bar"><button class="p" id="ok">Approve (A)</button><button id="ed">${editing ? "Save edit" : "Edit"}</button><button class="b" id="no">Reject (R)</button><span class="cmt">J / K to move</span></div>`;
        $("#ok").onclick = () => decide(it, "approved");
        $("#no").onclick = () => decide(it, "rejected");
        $("#ed").onclick = () => {
          if (!editing) {
            editing = true;
            renderDetail();
            return;
          }
          decide(it, "edited");
        };
      }
      function decide(it, action) {
        const replies = {};
        document
          .querySelectorAll("textarea[data-r]")
          .forEach((t) => (replies[t.dataset.r] = t.value));
        const edit = it.primary.edit ? { ...it.primary.edit } : null;
        const nr = $("#newrep");
        if (edit && nr) edit.replace = nr.value;
        audit.push({
          ts: new Date().toISOString(),
          qid: it.qid,
          reportIds: it.rs.map((r) => r.reportId),
          action,
          repair: it.primary.repair,
          route: it.primary.route,
          edit,
          replies: action === "edited" ? replies : undefined,
          by: "faculty",
        });
        persist();
        editing = false;
        const v = vis(),
          i = v.findIndex((x) => x.qid === it.qid);
        sel = (v[i + 1] || v[i - 1] || {}).qid || null;
        render();
      }
      function renderLog() {
        $("#detail").innerHTML =
          `<div class="card"><h3>Audit log (${audit.length})</h3><button id="exp">Download JSON</button>
  ${
    [...audit]
      .reverse()
      .map(
        (a) =>
          `<p><b>${esc(a.action)}</b> · ${esc(a.reportIds.join(", "))} · ${esc(a.repair || "—")} <span class="cmt">${new Date(a.ts).toLocaleString()}</span></p>`,
      )
      .join("") || "<p class='cmt'>No actions yet.</p>"
  }</div>`;
        $("#exp").onclick = () => {
          const u = URL.createObjectURL(
            new Blob([JSON.stringify(audit, null, 2)], {
              type: "application/json",
            }),
          );
          const a = document.createElement("a");
          a.href = u;
          a.download = "audit.json";
          a.click();
        };
      }
      $("#logb").onclick = () => {
        showLog = !showLog;
        showLog ? renderLog() : renderDetail();
      };
      document.addEventListener("keydown", (e) => {
        if (/INPUT|TEXTAREA/.test(e.target.tagName) || e.ctrlKey || e.metaKey)
          return;
        const v = vis(),
          i = v.findIndex((x) => x.qid === sel),
          it = items.find((x) => x.qid === sel);
        if (e.key === "j" && v[i + 1]) {
          sel = v[i + 1].qid;
          render();
        }
        if (e.key === "k" && v[i - 1]) {
          sel = v[i - 1].qid;
          render();
        }
        if (e.key === "a" && it && tab === "todo") decide(it, "approved");
        if (e.key === "r" && it && tab === "todo") decide(it, "rejected");
      });
      render();
    </script>
  </body>
</html>
